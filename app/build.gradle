plugins {
    // The application plugin aids with building a CLI application in Java.
    id 'application'
    // This seems to be the standard Avro schema plugin, even though it's
    // no longer actively maintained
    id 'com.github.davidmc24.gradle.plugin.avro' version '1.9.1'
}

repositories {
    // Use Maven Central for resolving general dependencies.
    mavenCentral()
    // Add Confluent dependencies for Schema Registry client and Avro Serdes
    maven {
        url "https://packages.confluent.io/maven/"
    }
}

// We're targeting Java 21 as a "safe" choice
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation 'org.apache.kafka:kafka-streams:3.6.0'
    //implementation 'org.apache.kafka:kafka-streams:3.8.0'

    // Confluent Avro Serdes (which is compatible with Karapace)
    implementation 'io.confluent:kafka-streams-avro-serde:7.6.1'
    //implementation 'io.confluent:kafka-streams-avro-serde:8.1.0'

    // Avro dependency (for generated classes)
    implementation 'org.apache.avro:avro:1.11.3'

    implementation 'org.slf4j:slf4j-api:2.0.13'
    implementation 'org.slf4j:slf4j-simple:2.0.13'

    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Indicate where our Avro .avsc file is to be found (the default is "src/main/avro")
sourceSets {
    main {
        resources {
            srcDirs 'app/src/main/avro'
        }
    }
}


application {
    // Define the main class for the application.
    mainClass = 'org.example.FilterApp'
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}

// Do we still need this?
tasks.register('copyDependencies', Copy) {
    from(sourceSets.main.runtimeClasspath)
    into('libs')
}

tasks.register('uberJar', Jar) {
    archiveClassifier = 'uber'

    manifest {
        attributes 'Main-Class': 'org.example.FilterApp'
    }

    archiveBaseName = 'FilterApp';

    from sourceSets.main.output

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath.findAll { it.name.endsWith('jar') }.collect { zipTree(it) }
    }
}
